name: AI Review Rerun

on:
  workflow_run:
    workflows: [AI Review]
    types: [completed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited]

permissions:
  actions: write
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: >-
    ai-review-rerun-${{ github.event.issue.number ||
      github.event.pull_request.number ||
      github.event.workflow_run.pull_requests[0].number ||
      github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  ai-review-rerun:
    name: ai-review-rerun
    if: |
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request'
      ) ||
      (
        github.event_name == 'pull_request_review' &&
        github.event.review.user.type == 'Bot'
      ) ||
      (
        github.event.issue.pull_request &&
        github.event.comment.user.type == 'Bot' &&
        (
          github.event.action == 'edited' ||
          startsWith(github.event.comment.body, 'Codex Review:') ||
          contains(github.event.comment.body, '<!-- codex-review-receipt:') ||
          contains(github.event.comment.body, '<!-- codex-pull-request-review-summary -->') ||
          contains(github.event.comment.body, 'create an environment for this repo') ||
          contains(github.event.comment.body, 'create a Codex account and connect to GitHub') ||
          contains(github.event.comment.body, 'AI_REVIEW_OUTCOME:')
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Rerun AI Review for trusted evidence
        run: |
          if [ -f scripts/ai-review-rerun.mjs ]; then
            node scripts/ai-review-rerun.mjs
          else
            echo "::warning::Trusted rerun script is missing on the default branch; skipping first-install bootstrap event."
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_REVIEW_AGENT: ${{ vars.AI_REVIEW_AGENT }}
