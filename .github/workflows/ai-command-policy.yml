name: AI Command Policy

on:
  issue_comment:
    types: [created]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  actions: write
  contents: read
  pull-requests: write
  issues: write

jobs:
  policy:
    if: >
      github.event.comment.user.type == 'User' &&
      (
        contains(github.event.comment.body, '@claude') ||
        contains(github.event.comment.body, '@codex') ||
        contains(github.event.comment.body, '/gemini review') ||
        contains(github.event.comment.body, '@gemini-code-assist review')
      )
    name: ai-command-policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Validate trusted actor and record review request
        run: node scripts/ai-command-policy.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_IMPLEMENTATION_AGENT: ${{ vars.AI_IMPLEMENTATION_AGENT }}
          AI_REVIEW_AGENT: ${{ vars.AI_REVIEW_AGENT }}
